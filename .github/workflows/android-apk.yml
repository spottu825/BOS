name: Build BOS APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Keep same debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bos-debug-keystore-v1

      - name: Build debug APKs
        env:
          BOS_RELAY_URL: ${{ vars.BOS_RELAY_URL || secrets.BOS_RELAY_URL }}
        run: gradle :app:assembleSafeDebug :app:assembleFullDebug

      - name: Upload safe debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BOS-safe-debug-apk
          path: app/build/outputs/apk/safe/debug/app-safe-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload full debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BOS-full-debug-apk
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
          if-no-files-found: error
          retention-days: 14
