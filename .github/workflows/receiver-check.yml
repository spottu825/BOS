name: Check BOS Receiver

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-receiver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: receiver
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: receiver/package.json

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: npm run check
